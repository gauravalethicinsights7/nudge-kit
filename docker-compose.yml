services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudge
    ports:
      - "5432:5432"
    volumes:
      - nudge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudge -d nudge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL — inside the compose network the DB is
      # reachable at the service name "postgres", not "localhost".
      DATABASE_URL: postgresql+psycopg://nudge:nudge@postgres:5432/nudge
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nudge_uploads:/app/var/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  nudge_pgdata:
  nudge_uploads:
